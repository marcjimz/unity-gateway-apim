[project]
name = "unity-gateway-apim"
version = "0.1.0"
description = "End-to-end Entra identity across Azure API Management, Azure Databricks, and Microsoft Foundry."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "msal>=1.31",
    "pytest>=8.3",
]

[project.optional-dependencies]
foundry = [
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "feasibility: Phase 0 assumption checks against real resources",
    "e2e: end-to-end flow checks against real resources",
]
addopts = "-ra"
